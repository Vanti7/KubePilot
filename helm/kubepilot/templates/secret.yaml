{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubepilot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
  annotations:
    # The generated JWT secret must survive upgrades, otherwise every session is
    # invalidated on each `helm upgrade`.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kubepilot.fullname" .) }}
  {{- if .Values.secret.jwtSecret }}
  jwt-secret: {{ .Values.secret.jwtSecret | quote }}
  {{- else if and $existing $existing.data (index $existing.data "jwt-secret") }}
  jwt-secret: {{ index $existing.data "jwt-secret" | b64dec | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 48 | quote }}
  {{- end }}
  {{- if .Values.admin.password }}
  admin-password: {{ .Values.admin.password | quote }}
  {{- end }}
  {{- if and .Values.externalPostgresql.enabled .Values.externalPostgresql.password }}
  db-password: {{ .Values.externalPostgresql.password | quote }}
  {{- end }}
{{- end }}
