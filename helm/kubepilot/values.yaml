# Default values for KubePilot.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/kubepilot/backend
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kubepilot/frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  # Uses the fullname when empty.
  name: ""
  annotations: {}

rbac:
  create: true
  # nodes/proxy is required for the agentless node metrics (CPU/RAM/disk read
  # from each kubelet's Summary API). Set to false if cluster policy forbids it;
  # the node metrics panels then stay empty.
  nodeMetrics: true

config:
  logLevel: info
  # Registers the cluster KubePilot runs in, using the pod's ServiceAccount.
  inCluster: true
  clusterName: local
  # Polling interval for image registries and chart repositories.
  workerIntervalSeconds: 300
  # Base URL of a Headlamp instance, for deep links from workloads.
  headlampURL: ""
  # Skip TLS verification when talking to registered clusters.
  tlsInsecure: false
  nodeMetricsEnabled: true
  nodeMetricsRetentionHours: 168
  # Let the Helm watcher fall back to Artifact Hub to find which repository an
  # installed chart came from. Disable to keep chart resolution fully offline.
  helmAutodiscover: true
  # Extra environment variables, e.g. [{name: FOO, value: bar}].
  extraEnv: []

# First-run admin account. When password is empty one is generated and printed
# to the backend logs (see NOTES).
admin:
  email: ""
  password: ""
  name: Administrator

secret:
  create: true
  # Reference an existing Secret instead of creating one. It must carry the keys
  # jwt-secret, and admin-password / db-password when those are used.
  existingSecret: ""
  # Generated on install when empty. Set it explicitly to keep sessions valid
  # across a full reinstall.
  jwtSecret: ""

# Storage backend. "sqlite" needs no external database and stores everything on
# a PersistentVolume; "postgres" uses externalPostgresql below.
storage:
  driver: sqlite
  sqlite:
    path: /data/kubepilot.db

# Cache backend: "memory" (default, single replica) or "redis".
cache:
  driver: memory

persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 2Gi
  storageClass: ""

externalPostgresql:
  enabled: false
  host: ""
  port: 5432
  username: kubepilot
  database: kubepilot
  sslMode: disable
  # Provide either password (stored in the chart's Secret) or existingSecret.
  password: ""
  existingSecret: ""
  existingSecretKey: db-password

externalRedis:
  enabled: false
  host: ""
  port: 6379

ingress:
  enabled: false
  className: ""
  annotations: {}
    # Server-sent events need a long read timeout and no response buffering:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts: []
    # - host: kubepilot.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []
    # - secretName: kubepilot-tls
    #   hosts:
    #     - kubepilot.example.com

# Long-lived ServiceAccount token for this cluster, so another KubePilot
# instance (or a third-party tool) can read it.
integrationToken:
  create: true

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   memory: 512Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
